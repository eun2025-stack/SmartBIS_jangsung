# New arrival refresh defaults only. Does not enable collection or change observation mode.
# Existing 10-second poll is a wake-up tick, not the per-target ETA requery interval.
tago.arrival.requery-interval-ms=60000
tago.arrival.refresh-threshold-minutes=3
tago.arrival.half-lower-seconds=60
tago.arrival.soon-seconds=30
tago.arrival.half-ratio=0.5
tago.arrival.half-minimum-seconds=30
tago.arrival.passage-grace-seconds=60
