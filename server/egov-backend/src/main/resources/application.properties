spring.application.name=smartbis-backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
content.root=${CONTENT_ROOT:/app/content-store}
smartbis.device-identity.hmdm-root-config=${HMDM_ROOT_CONFIG:/run/hmdm/ROOT.xml}

# Temporary diagnostic: CsrfFilter reports rejection context but never logs token values.
logging.level.org.springframework.security.web.csrf.CsrfFilter=DEBUG

# TAGO API
tago.enabled=${TAGO_ENABLED:false}
tago.mock-mode=${TAGO_MOCK_MODE:true}
tago.service-key=${TAGO_SERVICE_KEY:}
tago.service-key-mode=${TAGO_SERVICE_KEY_MODE:AUTO}
tago.city-code=${TAGO_CITY_CODE:}
tago.poll-interval-seconds=${TAGO_POLL_INTERVAL_SECONDS:30}
tago.retry-count=${TAGO_RETRY_COUNT:3}
tago.retry-delay-seconds=${TAGO_RETRY_DELAY_SECONDS:10}
tago.catalog.sync-cron=${TAGO_CATALOG_SYNC_CRON:0 0 3 * * *}
tago.vehicle-location.enabled=${TAGO_VEHICLE_LOCATION_ENABLED:false}
tago.vehicle-location.poll-interval-ms=${TAGO_VEHICLE_LOCATION_POLL_INTERVAL_MS:10000}
tago.location.observation-mode=${TAGO_LOCATION_OBSERVATION_MODE:false}
tago.location.always-call=${TAGO_LOCATION_ALWAYS_CALL:false}
tago.location.operations.lane-a-start=${TAGO_LOCATION_LANE_A_START:05:15}
tago.location.operations.lane-a-end=${TAGO_LOCATION_LANE_A_END:21:15}
tago.location.operations.lane-a-interval-seconds=${TAGO_LOCATION_LANE_A_INTERVAL_SECONDS:600}
tago.location.operations.lane-c-start=${TAGO_LOCATION_LANE_C_START:06:00}
tago.location.operations.lane-c-end=${TAGO_LOCATION_LANE_C_END:21:00}
tago.location.operations.lane-c-interval-seconds=${TAGO_LOCATION_LANE_C_INTERVAL_SECONDS:1800}
tago.location.operations.lane-c-inter-route-delay-seconds=${TAGO_LOCATION_LANE_C_INTER_ROUTE_DELAY_SECONDS:2}
tago.location.operations.lane-c-429-delay-step2-seconds=${TAGO_LOCATION_LANE_C_429_DELAY_STEP2_SECONDS:3}
tago.location.operations.lane-c-429-delay-step3-seconds=${TAGO_LOCATION_LANE_C_429_DELAY_STEP3_SECONDS:5}
tago.location.operations.local-lead-minutes=${TAGO_LOCATION_LOCAL_LEAD_MINUTES:15}
tago.location.operations.variant-lead-minutes=${TAGO_LOCATION_VARIANT_LEAD_MINUTES:10}
tago.location.operations.window-end-padding-minutes=${TAGO_LOCATION_WINDOW_END_PADDING_MINUTES:10}
tago.location.operations.default-minutes-per-stop=${TAGO_LOCATION_DEFAULT_MINUTES_PER_STOP:1.2}
tago.location.operations.default-one-way-minutes=${TAGO_LOCATION_DEFAULT_ONE_WAY_MINUTES:60}
tago.location.operations.variant-route-ids=${TAGO_LOCATION_VARIANT_ROUTE_IDS:${tago.location.route-groups.variant:}}
tago.arrival.enabled=${TAGO_ARRIVAL_ENABLED:false}
public.base-url=${PUBLIC_BASE_URL}
tago.arrival.poll-interval-ms=${TAGO_ARRIVAL_POLL_INTERVAL_MS:10000}

# MOCT administrative-boundary data used for internal stop-to-region grouping.
moct.wfs.service-key=${MOCT_WFS_SERVICE_KEY:}
moct.wfs.domain=${MOCT_WFS_DOMAIN:https://localhost:8443}
