spring.application.name=smartbis-backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
content.root=${CONTENT_ROOT:/app/content-store}

# TAGO API
tago.enabled=${TAGO_ENABLED:false}
tago.mock-mode=${TAGO_MOCK_MODE:true}
tago.service-key=${TAGO_SERVICE_KEY:}
tago.service-key-mode=${TAGO_SERVICE_KEY_MODE:AUTO}
tago.city-code=${TAGO_CITY_CODE:}
tago.poll-interval-seconds=${TAGO_POLL_INTERVAL_SECONDS:30}
tago.retry-count=${TAGO_RETRY_COUNT:3}
tago.retry-delay-seconds=${TAGO_RETRY_DELAY_SECONDS:10}
