# Inert unless the web2-observation profile is explicitly selected. No credentials or default production DB.
spring.datasource.url=${WEB2_TEST_DB_URL}
spring.datasource.username=${WEB2_TEST_DB_USERNAME}
spring.datasource.password=${WEB2_TEST_DB_PASSWORD}
tago.enabled=true
tago.vehicle-location.enabled=true
tago.arrival.enabled=true
tago.location.observation-mode=true
tago.catalog.sync-cron=-
tago.location.operations.enabled=true
tago.location.operations.local.enabled=true
tago.location.operations.hundred.enabled=true
tago.location.operations.close-after-last-minutes=5
tago.location.operations.no-observation-max-minutes=60
tago.location.operations.lane-c-inter-route-delay-seconds=2
tago.location.operations.lane-c-interval-seconds=1800
tago.arrival.daily-limit=9000
budget.retry_max=2
budget.retry_gap_sec=10
public.base-url=${PUBLIC_BASE_URL:https://jangseong.go.kr:8443}
