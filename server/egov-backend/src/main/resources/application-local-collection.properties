# Only the explicitly selected local-collection profile uses these settings.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.enabled=false
tago.enabled=true
tago.mock-mode=false
tago.vehicle-location.enabled=true
tago.arrival.enabled=true
tago.location.observation-mode=true
tago.catalog.sync-cron=-
tago.location.operations.enabled=true
tago.location.operations.local.enabled=true
tago.location.operations.hundred.enabled=true
tago.location.operations.daily-limit=9500
tago.arrival.daily-limit=9000
budget.retry_max=2
budget.retry_gap_sec=10
tago.location.operations.retry-delay-ms=10000
tago.location.operations.lane-a-start=05:15
tago.location.operations.lane-a-end=21:15
tago.location.operations.lane-a-interval-seconds=600
tago.location.operations.local-lead-minutes=15
tago.location.operations.local.interval-seconds=600
tago.location.operations.hundred.interval-seconds=600
tago.location.operations.variant-lead-minutes=10
tago.location.operations.close-after-last-minutes=5
tago.location.operations.no-observation-max-minutes=60
tago.location.operations.lane-c-start=06:00
tago.location.operations.lane-c-end=21:00
tago.location.operations.lane-c-interval-seconds=1800
tago.location.operations.lane-c-inter-route-delay-seconds=2
tago.location.operations.lane-c-429-delay-step2-seconds=3
tago.location.operations.lane-c-429-delay-step3-seconds=5
tago.arrival.stop-step=2
public.base-url=${PUBLIC_BASE_URL}
collection.stop-at=${LOCAL_COLLECTION_STOP_AT}
collection.capture-metadata=true
collection.control-directory=${COLLECTION_CONTROL_DIRECTORY:/collection-control}
