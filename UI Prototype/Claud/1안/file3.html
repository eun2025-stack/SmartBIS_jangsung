<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>장성군 시내버스 안내 - 안3 자연친화형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F1E1; --dark:#1F2E22; --green1:#2F5233; --green2:#4C7A4E; --green3:#8FB08A;
  --terracotta:#B5563C; --yellow:#E8B94C;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Noto Sans KR',sans-serif;}
#stageWrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000;}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;flex-shrink:0;}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 1s ease-in-out;}
.slide.active{opacity:1;pointer-events:auto;}
.mountains{position:absolute;left:0;right:0;bottom:0;height:340px;}
.mountains .layer{position:absolute;bottom:0;left:0;width:100%;height:100%;}
.mountains .l1{background:var(--green3);opacity:.35;clip-path:polygon(0 60%,15% 40%,32% 55%,50% 30%,68% 52%,85% 35%,100% 55%,100% 100%,0 100%);}
.mountains .l2{background:var(--green2);opacity:.5;clip-path:polygon(0 70%,18% 50%,38% 68%,55% 42%,72% 65%,90% 48%,100% 68%,100% 100%,0 100%);}
.mountains .l3{background:var(--green1);opacity:.65;clip-path:polygon(0 85%,20% 70%,40% 82%,60% 62%,80% 80%,100% 68%,100% 100%,0 100%);}
.clock{position:absolute;top:56px;right:76px;font-size:32px;color:var(--dark);font-weight:700;opacity:.75;}
.gov-badge{position:absolute;top:54px;left:70px;width:92px;height:92px;border-radius:50%;background:var(--dark);border:5px solid var(--yellow);display:flex;align-items:center;justify-content:center;color:var(--yellow);font-size:22px;font-weight:900;text-align:center;line-height:1.2;}
.section-tag{font-family:'Gowun Batang',serif;font-size:40px;font-weight:700;letter-spacing:4px;}

/* 1. 정류소 도착정보 */
#slide-stop{background:linear-gradient(180deg,#FBF7EA,var(--cream));}
.stop-main{position:absolute;top:230px;left:0;right:0;text-align:center;color:var(--dark);}
.stop-main .label{font-family:'Gowun Batang',serif;font-size:44px;color:var(--green1);font-weight:700;letter-spacing:4px;}
.stop-main .cur-stop{font-size:158px;font-weight:900;margin:12px 0 6px;color:var(--dark);}
.arrow{font-size:56px;color:var(--terracotta);margin:6px 0;animation:bounce 1.4s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(14px);}}
.next-stop{font-size:104px;font-weight:900;color:var(--terracotta);}
.route-line{position:absolute;bottom:160px;left:140px;right:140px;display:flex;justify-content:space-between;z-index:5;}
.route-line::before{content:'';position:absolute;top:20px;left:0;right:0;height:6px;background:rgba(47,82,51,.25);border-radius:3px;}
.stop-node{position:relative;width:25%;display:flex;flex-direction:column;align-items:center;}
.node-dot{width:38px;height:38px;border-radius:50%;background:var(--cream);border:5px solid var(--green2);z-index:2;display:flex;align-items:center;justify-content:center;font-size:20px;}
.stop-node.passed .node-dot{background:var(--green2);}
.stop-node.current .node-dot{width:62px;height:62px;background:var(--terracotta);border-color:var(--terracotta);box-shadow:0 0 0 0 rgba(181,86,60,.5);animation:pulse 1.6s infinite;}
.node-name{margin-top:18px;font-size:28px;font-weight:700;color:var(--green1);text-align:center;}
.stop-node.current .node-name{color:var(--terracotta);font-size:32px;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(181,86,60,.5);}70%{box-shadow:0 0 0 26px rgba(181,86,60,0);}100%{box-shadow:0 0 0 0 rgba(181,86,60,0);}}

/* 2. 공지사항 */
#slide-notice{background:linear-gradient(180deg,#F5EED9,#EFE6CF);}
#slide-notice .section-tag{color:var(--green1);}
.center-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 220px;z-index:5;}
.big-icon{font-size:96px;margin:22px 0;}
.big-title{font-family:'Gowun Batang',serif;font-size:92px;color:var(--dark);margin-bottom:40px;}
.big-body{font-size:52px;color:#3a4a3d;font-weight:500;line-height:1.6;}

/* 3. 행사 */
#slide-event{background:linear-gradient(180deg,#FCE6C9,#F3B487);}
#slide-event .section-tag{color:var(--terracotta);}
#slide-event .big-title{color:#5c2f1a;}
.event-meta{display:flex;gap:70px;margin-top:46px;justify-content:center;}
.event-meta div{font-size:40px;color:#6b3520;font-weight:800;}

/* 4. 재난정보 */
#slide-disaster{background:linear-gradient(180deg,#7A1F1F,#4a1010);}
.hazard-strip{position:absolute;left:0;right:0;height:24px;background:repeating-linear-gradient(45deg,#2a0505 0 28px,#a83232 28px 56px);}
.hazard-strip.top{top:0;} .hazard-strip.bottom{bottom:0;}
#slide-disaster .section-tag{color:#ffe3d6;letter-spacing:6px;}
.warn-icon{font-size:128px;animation:warn 1s infinite;}
@keyframes warn{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
#slide-disaster .big-title{color:#fff;font-family:'Noto Sans KR';font-size:106px;font-weight:900;}
#slide-disaster .big-body{color:#ffe1d6;font-weight:700;font-size:54px;}
#slide-disaster .clock{color:#ffe1d6;opacity:.8;}
#slide-disaster .gov-badge{border-color:#ffdada;background:#3a0d0d;color:#ffdada;}

.dots{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:10;}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(31,46,34,.25);}
#slide-disaster ~ .dots .dot, .slide#slide-disaster .dots .dot{background:rgba(255,255,255,.3);}
.dot.active{background:var(--terracotta);width:44px;border-radius:8px;}
</style>
</head>
<body>
<div id="stageWrap"><div id="stage">

  <section class="slide active" id="slide-stop" data-duration="9000">
    <div class="gov-badge">장성군</div>
    <div class="clock"></div>
    <div class="stop-main">
      <p class="label">이번 정류장</p>
      <h1 class="cur-stop">장성터미널</h1>
      <div class="arrow">▼</div>
      <p class="label">다음 정류장</p>
      <h2 class="next-stop">장성읍사무소</h2>
    </div>
    <div class="route-line">
      <div class="stop-node passed"><span class="node-dot"></span><span class="node-name">문화예술회관</span></div>
      <div class="stop-node current"><span class="node-dot">🚌</span><span class="node-name">장성터미널</span></div>
      <div class="stop-node"><span class="node-dot"></span><span class="node-name">장성읍사무소</span></div>
      <div class="stop-node"><span class="node-dot"></span><span class="node-name">장성역</span></div>
    </div>
    <div class="mountains"><div class="layer l1"></div><div class="layer l2"></div><div class="layer l3"></div></div>
  </section>

  <section class="slide" id="slide-notice" data-duration="7000">
    <div class="gov-badge">장성군</div>
    <div class="clock"></div>
    <div class="center-wrap">
      <p class="section-tag">📜 공지사항</p>
      <div class="big-icon">🔔</div>
      <h1 class="big-title" id="noticeTitle"></h1>
      <p class="big-body" id="noticeBody"></p>
    </div>
    <div class="mountains"><div class="layer l1"></div><div class="layer l2"></div></div>
  </section>

  <section class="slide" id="slide-event" data-duration="7000">
    <div class="gov-badge">장성군</div>
    <div class="clock"></div>
    <div class="center-wrap">
      <p class="section-tag">🎪 행사안내</p>
      <div class="big-icon">🎉</div>
      <h1 class="big-title" id="eventTitle"></h1>
      <div class="event-meta">
        <div id="eventDate"></div>
        <div id="eventPlace"></div>
      </div>
    </div>
  </section>

  <section class="slide" id="slide-disaster" data-duration="8000">
    <div class="hazard-strip top"></div>
    <div class="hazard-strip bottom"></div>
    <div class="gov-badge">장성군</div>
    <div class="clock"></div>
    <div class="center-wrap">
      <p class="section-tag">재난 · 안전 안내</p>
      <div class="warn-icon">⚠</div>
      <h1 class="big-title">호우주의보 발효 중</h1>
      <p class="big-body">하천 주변 이동을 자제하시고 안내방송에 따라 안전에 유의하시기 바랍니다.</p>
    </div>
  </section>

  <div class="dots">
    <span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

</div></div>

<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(window.innerWidth/1920, window.innerHeight/1080);stage.style.transform=`scale(${s})`;}
window.addEventListener('resize',fit); fit();

const slides=[...document.querySelectorAll('.slide')];
const dots=[...document.querySelectorAll('.dot')];
let cur=0, timer;
function go(i){
  slides[cur].classList.remove('active'); dots[cur].classList.remove('active');
  cur=i;
  slides[cur].classList.add('active'); dots[cur].classList.add('active');
  clearTimeout(timer);
  timer=setTimeout(()=>go((cur+1)%slides.length), +slides[cur].dataset.duration || 7000);
}
timer=setTimeout(()=>go((cur+1)%slides.length), +slides[0].dataset.duration || 7000);

function tick(){
  const d=new Date(); const w=['일','월','화','수','목','금','토'];
  document.querySelectorAll('.clock').forEach(el=>{
    el.textContent = `${d.getMonth()+1}월 ${d.getDate()}일(${w[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  });
}
tick(); setInterval(tick,10000);

function rotator(arr, render, interval){ let i=0; render(arr[0]); setInterval(()=>{ i=(i+1)%arr.length; render(arr[i]); }, interval); }

const noticeData=[
  {title:'시내버스 요금 안내', body:'성인 1,400원 · 청소년 1,100원 · 어린이 700원 (교통카드 기준)'},
  {title:'노선 변경 안내', body:'11월 1일부터 상무대 경유 노선이 일부 변경됩니다.'},
  {title:'분실물 안내', body:'분실물은 장성군 버스 종합상황실(061-390-0000)로 문의하세요.'}
];
rotator(noticeData, n=>{document.getElementById('noticeTitle').textContent=n.title; document.getElementById('noticeBody').textContent=n.body;}, 5000);

const eventData=[
  {title:'2025 장성 홍길동 축제', date:'📅 10.24 ~ 10.26', place:'📍 홍길동테마파크'},
  {title:'장성 편백숲 치유 프로그램', date:'📅 매주 토요일', place:'📍 축령산 편백숲'}
];
rotator(eventData, e=>{document.getElementById('eventTitle').textContent=e.title; document.getElementById('eventDate').textContent=e.date; document.getElementById('eventPlace').textContent=e.place;}, 6000);
</script>
</body>
</html>
