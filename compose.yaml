name: smartbis_jangsung

services:
  postgres-db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  egov-backend:
    build:
      context: ./server/egov-backend
    environment:
      CONTENT_ROOT: /app/content-store
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:?Set DASHBOARD_ADMIN_USERNAME in .env}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:?Set DASHBOARD_ADMIN_PASSWORD in .env}
      TAGO_SERVICE_KEY: ${TAGO_SERVICE_KEY:-}
      TAGO_CITY_CODE: ${TAGO_CITY_CODE:-}
      TAGO_ENABLED: ${TAGO_ENABLED:-false}
      TAGO_MOCK_MODE: ${TAGO_MOCK_MODE:-true}
      TAGO_SERVICE_KEY_MODE: ${TAGO_SERVICE_KEY_MODE:-AUTO}
      TAGO_POLL_INTERVAL_SECONDS: ${TAGO_POLL_INTERVAL_SECONDS:-30}
      TAGO_RETRY_COUNT: ${TAGO_RETRY_COUNT:-3}
      TAGO_RETRY_DELAY_SECONDS: ${TAGO_RETRY_DELAY_SECONDS:-10}
    expose:
      - "8080"
    volumes:
      - ./content-store:/app/content-store:ro
    depends_on:
      - postgres-db
    restart: unless-stopped

  node-watcher:
    build:
      context: ./server/node-watcher
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      DB_HOST: postgres-db
      DB_PORT: 5432
      UPLOAD_ROOT: /app/upload-store
      CONTENT_ROOT: /app/content-store
    volumes:
      - ./upload-store:/app/upload-store
      - ./content-store:/app/content-store
    depends_on:
      - postgres-db
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:alpine
    ports:
      - "8443:443"
    volumes:
      - ./server/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - egov-backend
    restart: unless-stopped

volumes:
  db-data:
